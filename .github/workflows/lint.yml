name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown and wikilinks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: '**/*.md'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wikilink check
        run: node .github/scripts/check-wikilinks.mjs

      - name: OKF type check
        run: node .github/scripts/check-types.mjs

      - name: Template check
        run: node .github/scripts/check-templates.mjs

      # House style: no em-dashes in shipped markdown or Bases. CHANGELOG.md
      # is generated by release-please and exempt. The character is written
      # as an escape so this file stays clean too.
      - name: Em-dash check
        run: |
          dash=$(printf '\342\200\224')
          if git grep -n -I -e "$dash" -- '*.md' '*.base' ':(exclude)CHANGELOG.md'; then
            echo "::error::Em-dash found. Use a colon, comma, semicolon or a new sentence."
            exit 1
          fi
          echo "No em-dashes in shipped markdown or Bases."
